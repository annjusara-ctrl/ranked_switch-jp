<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked Switch JP</title>
    <style>
        /* 🎨 共通のスタイル設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
        }

        /* 💻 パソコン用（横画面：基本設定） */
        body.mode-intro {
            background-image: url('startA.jpg');
        }
        body.mode-main {
            background-image: url('nextA.jpg');
        }

        /* 📱 スマホ用（縦画面設定） */
        @media (max-width: 1080px) {
            body.mode-intro {
                background-image: url('startB.jpg');
            }
            body.mode-main {
                background-image: url('nextB.jpg');
            }
        }

        /* 🔊 画面右上の音量コントローラー */
        #volume-controls {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        #volume-controls span {
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .volume-slider {
            width: 80px;
            cursor: pointer;
            accent-color: #7289da;
        }

        /* 🚪 1. 最初の入り口画面 */
        #intro-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
        }
        .welcome-text {
            font-size: 18px;
            color: #7289da;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
        }
        .title-text {
            font-size: 36px;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .enter-btn {
            background-color: #7289da;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.6);
            transition: all 0.2s ease;
        }
        .enter-btn:hover {
            transform: scale(1.1);
            background-color: #5b73c7;
            box-shadow: 0 0 25px rgba(114, 137, 218, 0.9);
        }

        /* 🏠 2. メイン画面（グレーの半透明枠） */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease forwards;
            background: rgba(0, 0, 0, 0.45);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 20px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }
        
        /* Discordボタンを囲むリンクの設定 */
        .discord-link-wrapper {
            display: inline-block;
            border-radius: 27px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }
        .discord-link-wrapper:hover {
            transform: scale(1.05);
        }

        .discord-btn {
            display: block;
            cursor: pointer;
            margin: -6px; 
        }

        /* 説明文欄 */
        .description-box {
            margin-top: 25px;
            text-align: left;
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }
        .description-box p {
            margin: 8px 0;
        }

        /* 🪄 最後のテキストリンク用のおしゃれなアニメーション設定 */
        .text-link-btn {
            display: block;
            margin-top: 20px;
            font-weight: bold;
            color: #7289da; /* Discordの青紫色 */
            text-align: center;
            text-decoration: none; /* 下線を消す */
            transition: transform 0.2s ease, text-shadow 0.2s ease;
            cursor: pointer;
        }
        .text-link-btn:hover {
            transform: scale(1.1); /* 💡 マウスを乗せたらボタンと同じようにフワッと大きくなる */
            text-shadow: 0 0 10px rgba(114, 137, 218, 0.8); /* ほんのり光る演出 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="mode-intro">

    <!-- 🔊 【右上】音量コントローラー -->
    <div id="volume-controls">
        <span id="volume-icon" onclick="toggleMute()">🔊</span>
        <input type="range" id="volume-range" class="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
    </div>

    <!-- 🚪 【画面A】入り口画面 -->
    <div id="intro-screen">
        <p class="welcome-text">WELCOME TO</p>
        <h2 class="title-text">Ranked Switch JP</h2>
        <button class="enter-btn" onclick="openSite()">ENTER</button>
    </div>

    <!-- 🏠 【画面B】メイン画面 -->
    <div id="main-content">
        <h1>Ranked SwitchのDiscordサーバーに参加しましょう！</h1>
        
        <a href="https://discord.gg/92pDPsPWvk" target="_blank" class="discord-link-wrapper">
            <img src="image.jpg" alt="DISCORDに参加する" width="300" class="discord-btn">
        </a>

        <!-- 説明文欄 -->
        <div class="description-box">
            <p>このRanked Switch JPは日本のスイッチでプレイしている人以外でも入れます。</p>
            <p>基本的にSKYやSUMOなどのRANKINGやTIERなどがあり、運営側がお金に余裕があれば、大会を立てることがあります。</p>
            <p>Ranked Switch JPにはBOTも含んでいます。</p>
            
            <!-- 💡 変更点：テキストを<a>タグで囲み、ボタンと同じようにアニメーションをつけました -->
            <a href="https://discord.gg/92pDPsPWvk" target="_blank" class="text-link-btn">
                ぜひ、入ってご覧ください。
            </a>
        </div>
    </div>

    <!-- 🎵 BGM音声プレイヤー -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- 🪄 画面切り替え・音量制御プログラム -->
    <script>
        const bgm = document.getElementById('bgm');
        const volumeIcon = document.getElementById('volume-icon');
        const volumeRange = document.getElementById('volume-range');
        let lastVolume = 0.5;

        bgm.volume = 0.5;

        function openSite() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('volume-controls').style.display = 'flex';
            
            document.body.classList.remove('mode-intro');
            document.body.classList.add('mode-main');
            
            bgm.muted = false;
            bgm.play();
        }

        function changeVolume(val) {
            bgm.volume = val;
            if (val == 0) {
                volumeIcon.innerText = "🔈";
                bgm.muted = true;
            } else {
                volumeIcon.innerText = "🔊";
                bgm.muted = false;
                lastVolume = val;
            }
        }

        function toggleMute() {
            if (bgm.muted) {
                bgm.muted = false;
                bgm.volume = lastVolume;
                volumeRange.value = lastVolume;
                volumeIcon.innerText = "🔊";
            } else {
                lastVolume = bgm.volume;
                bgm.muted = true;
                bgm.volume = 0;
                volumeRange.value = 0;
                volumeIcon.innerText = "🔈";
            }
        }
    </script>

</body>
</html>
